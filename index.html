<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpiderHub Premium Fixed Dashboard</title>
    <style>
        body {
            background-color: #080809;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        /* MAIN SINGLE WINDOW LAYOUT CONTAINER */
        .spider-panel {
            width: 580px;
            height: 420px; 
            background-color: #0a0a0c;
            border: 2px solid #ff0000;
            box-shadow: 0 25px 60px rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }
        /* EXPANDED HEADER PANEL */
        .panel-header {
            height: 95px; /* Height increased to accommodate a giant logo profile */
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: flex-start; /* Aligns content straight from the left rail edge */
            gap: 24px;
            border-bottom: 1px solid #1a1a22;
            background: linear-gradient(180deg, #121215, #0a0a0c);
            position: relative;
            z-index: 10;
        }
        /* EXTRA LARGE SPIDER LOGO BOX VIEWPORT */
        .logo-box-left {
            width: 140px; /* Unlocked to 120px to let the image expand to a massive size */
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
        }
        .logo-img-massive {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Enforces clean proportions without stretching or pixel blur */
            transform: scale(1.6); /* Magnifies the physical image footprint safely */
            transform-origin: center;
        }
        .title-text {
            color: #ff0000;
            font-weight: 800;
            font-size: 20px; /* Enlarged title to cleanly match the bold logo aesthetics */
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(255,0,0,0.5);
        }
        /* INNER CORE INTERACTION LAYERS */
        .panel-body {
            flex: 1;
            display: flex;
            background-color: rgba(10, 10, 12, 0.98);
            position: relative;
            z-index: 5;
        }
        /* LEFT SIDEBAR NAVIGATION RAIL */
        .panel-sidebar {
            width: 130px;
            background-color: #050507;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-right: 1px solid #14141a;
        }
        .tab-btn {
            width: 100%;
            padding: 10px;
            background-color: #101013;
            border: 1px solid #181822;
            color: #a0a0a5;
            font-weight: bold;
            font-size: 11.5px;
            text-align: left;
            padding-left: 12px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        .tab-btn:hover {
            color: #ffffff;
            border-color: #ff0000;
        }
        .tab-btn.active {
            background: linear-gradient(90deg, #800000, #c80000);
            color: white;
            border-color: #ff0000;
            box-shadow: 0 0 12px rgba(255,0,0,0.3);
        }
        /* RIGHT MAIN CONTENT VIEWPORT */
        .panel-content {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #111115;
            padding: 10px 14px;
            border-radius: 5px;
            border: 1px solid #181820;
        }
        .control-label {
            font-size: 12px;
            color: #e5e5e5;
            font-weight: 700;
            letter-spacing: 0.4px;
        }
        .action-btn {
            padding: 6px 16px;
            background-color: #1a1a22;
            border: 1px solid #2a2a35;
            color: #ffffff;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
            min-width: 100px;
            text-transform: uppercase;
            transition: all 0.15s ease;
        }
        .action-btn:hover {
            border-color: #ff0000;
        }
        .action-btn.active {
            background: linear-gradient(135deg, #005a00, #009900);
            border-color: #00ff00;
            box-shadow: 0 0 10px rgba(0,255,0,0.35);
        }
        .slider-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-color: #111115;
            padding: 10px 14px;
            border-radius: 5px;
            border: 1px solid #181820;
        }
        .slider-bar {
            width: 100%;
            height: 6px;
            background-color: #1c1c24;
            border-radius: 3px;
            position: relative;
        }
        .slider-fill {
            width: 16%;
            height: 100%;
            background-color: #ff0000;
            border-radius: 3px;
            box-shadow: 0 0 10px #ff0000;
        }
    </style>
</head>
<body>

    <div class="spider-panel">
        <div class="panel-header">
            <!-- MASSIVE SINGLE LOGO + TITLE HEAD GRID SECTION -->
            <div class="logo-box-left">
                <img src="assets/logo.png" alt="Logo" class="logo-img-massive">
            </div>
            <span class="title-text">SpiderHub Premium V4.0</span>
        </div>
        
        <div class="panel-body">
            <div class="panel-sidebar">
                <button class="tab-btn active" onclick="switchTab('movement')">Movement</button>
                <button class="tab-btn" onclick="switchTab('network')">Network Loop</button>
            </div>
            
            <div class="panel-content" id="movementPage">
                <div class="control-row">
                    <span class="control-label">NoClip</span>
                    <button class="action-btn" id="noclipBtn" onclick="toggleFeature('noclipBtn')">ACTIVATE</button>
                </div>
                <div class="control-row">
                    <span class="control-label">NoClips Not Working?</span>
                    <button class="action-btn" style="background-color: #005f9e; border-color: #00bfff;">FIX</button>
                </div>
                <div class="control-row">
                    <span class="control-label">Infinite Jump</span>
                    <button class="action-btn" id="jumpBtn" onclick="toggleFeature('jumpBtn')">ACTIVATE</button>
                </div>
                <div class="slider-container">
                    <div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; color: #9c9c9e;">
                        <span>Speed Dial Range</span>
                        <span>16</span>
                    </div>
                    <div class="slider-bar"><div class="slider-fill"></div></div>
                </div>
            </div>
            
            <div class="panel-content" id="networkPage" style="display: none;">
                <div class="control-row">
                    <span class="control-label">Rubber Band Lag?</span>
                    <button class="action-btn" style="background-color: #a65b00; border-color: #ff8c00;">FIX</button>
                </div>
            </div>
        </div>
    </div>

<script>
    function switchTab(tabName) {
        const tabs = document.querySelectorAll('.tab-btn');
        tabs.forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');

        if(tabName === 'movement') {
            document.getElementById('movementPage').style.display = 'flex';
            document.getElementById('networkPage').style.display = 'none';
        } else {
            document.getElementById('movementPage').style.display = 'none';
            document.getElementById('networkPage').style.display = 'flex';
        }
    }

    function toggleFeature(id) {
        const btn = document.getElementById(id);
        if(btn.classList.contains('active')) {
            btn.classList.remove('active');
            btn.innerText = 'ACTIVATE';
        } else {
            btn.classList.add('active');
            btn.innerText = 'ACTIVE';
        }
    }
</script>
</body>
</html>
